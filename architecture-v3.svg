<text x="56" y="1114" class="label">전환 상태</text>
<text x="176" y="1114" class="body">Spring은 전환 검증 대상이며, FastAPI → Spring → 보호소로 이어지는 호출 구조가 아닙니다.</text>
<text x="56" y="1152" class="label">데이터 기준</text>
<text x="176" y="1152" class="body">영양 기준·제품·가격은 기능 검증용 데모 데이터입니다.</text>
