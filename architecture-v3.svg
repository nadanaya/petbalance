<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1180" viewBox="0 0 1560 1180" role="img" aria-labelledby="title desc">
<title id="title">petbalance 서비스 아키텍처</title>
<desc id="desc">개인용 React와 Electron 앱은 FastAPI를 이용하고 실행 환경에 따라 SQLite 또는 PostgreSQL에 저장합니다. Spring Boot는 별도 SQLite와 CSV를 사용하는 전환 검증 구현입니다. 보호소 Next.js 앱은 자체 API와 Neon PostgreSQL을 사용합니다. 세 영역 사이에 런타임 호출을 나타내는 연결선은 없습니다.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="#648078" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <style>
    text { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
    .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 2px; }
    .heading { font-size: 27px; font-weight: 700; fill: #153e36; }
    .name { font-size: 25px; font-weight: 700; fill: #183e37; }
    .body { font-size: 18px; fill: #52685f; }
    .small { font-size: 16px; fill: #52685f; }
    .label { font-size: 15px; font-weight: 700; fill: #55766b; letter-spacing: .7px; }
    .card { fill: #fff; stroke: #d9e3dd; stroke-width: 1.5; }
