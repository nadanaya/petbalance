name: PR review bot

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "검토할 열린 PR 번호"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', inputs.pr_number) || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  review:
    if: always() && (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Review changed files and report
        uses: actions/github-script@v7
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        with:
          script: |
            const marker = '<!-- wooaeyoung-pr-review-bot -->';
            const pullNumber = Number(process.env.PR_NUMBER);
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
              per_page: 100,
            });
            const names = files.map(file => file.filename);
            const sourceChanged = names.some(name => name.startsWith('src/'));
            const testsChanged = names.some(name => /(^|\/)(__tests__|tests?)\//.test(name) || /\.(test|spec)\.[jt]sx?$/.test(name));
            const apiChanged = names.some(name => /(^|\/)api\.(ts|tsx|js)$/.test(name));
            const additions = files.reduce((sum, file) => sum + file.additions, 0);
            const deletions = files.reduce((sum, file) => sum + file.deletions, 0);
            const added = files.map(file => file.patch || '').join('\n').split('\n').filter(line => line.startsWith('+') && !line.startsWith('+++')).join('\n');
            const findings = [];
            if (process.env.VALIDATION_RESULT !== 'success') findings.push('🚨 TypeScript 검사 또는 Vite 빌드, 운영 의존성 감사가 실패했습니다. 체크 로그를 확인하세요.');
            if (sourceChanged && !testsChanged) findings.push('ℹ️ 화면·로직이 변경됐지만 자동 테스트 변경은 없습니다. 핵심 사용자 흐름의 수동 검증 증거를 PR에 남겨주세요.');
            if (apiChanged) findings.push('⚠️ API 연결 코드가 변경됐습니다. 백엔드 계약과 배포 API 주소를 함께 확인하세요.');
            if (additions + deletions > 1000) findings.push('⚠️ 변경량이 1,000줄을 넘습니다. 화면 또는 기능별 PR 분리가 가능한지 확인하세요.');
            if (/console\.(log|debug)\(/.test(added)) findings.push('⚠️ 추가된 코드에 `console.log/debug`가 있습니다. 배포 전에 제거할지 확인하세요.');
            if (/localhost|127\.0\.0\.1/.test(added)) findings.push('⚠️ 추가된 코드에 로컬 주소가 있습니다. 환경 변수와 배포 fallback이 올바른지 확인하세요.');
            if (/(api[_-]?key|secret|token|password)\s*[:=]\s*["'][^"']{8,}/i.test(added)) findings.push('🚨 추가된 코드에서 민감정보로 보이는 문자열을 발견했습니다. 실제 비밀값이면 즉시 제거하고 키를 폐기하세요.');
            const validation = process.env.VALIDATION_RESULT === 'success' ? '✅ 통과' : '❌ 실패';
            const body = [
              marker,
              '## 🤖 프론트엔드 PR 자동 검토',
              '',
              `- 빌드·운영 의존성 검사: ${validation}`,
              `- 변경 파일: **${files.length}개** (+${additions} / -${deletions})`,
              `- API 연결 코드: ${apiChanged ? '변경됨' : '변경 없음'}`,
              '',
              findings.length ? '### 확인 필요\n' + findings.map(item => `- ${item}`).join('\n') : '✅ 자동 검토에서 즉시 확인할 항목을 찾지 못했습니다.',
              '',
              '> 이 봇은 빌드·보안·변경 범위를 우선 확인합니다. 실제 화면, 모바일 레이아웃과 사용자 흐름은 사람의 검토가 필요합니다.',
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullNumber,
              per_page: 100,
            });
            const previous = comments.find(comment => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({owner: context.repo.owner, repo: context.repo.repo, comment_id: previous.id, body});
            } else {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: pullNumber, body});
            }
